<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎搭乘戀愛巴士🚌</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>
<body>
    <p class="tip"></p>
    <form id="google-form" class="contact100-form validate-form">
      <div class="cont">
  <div class="form sign-in" style="background-color:#FFF0F3">
    <h2>歡迎搭乘戀愛巴士🚌❤️‍🔥</h2>
    <label>
      <span>姓名</span>
      <input id="name" name="name" type="text" />
    </label>
    <label>
      <span>綽號</span>
      <input id="nickname" name="nickname" type="text" />
    </label>
    <label>
      <span>職業</span>
      <input id="job" name="job" type="text" />
    </label>
    <label>
      <span>理想型</span>
      <input id="ideal" name="ideal"  type="text" />
    </label>
    <label>
      <span>MBTI</span>
      <input id="mbti" name="mbti" type="text" />
    </label>
    <label>
    <span>你的戀愛風格？( EX:主動出擊 / 慢熟觀察型 / 朋友變情人型 / 看感覺型 )</span>  
        <input id="relationship" name="relationship" type="text" />
    </label>
  </div>
  <div class="sub-cont">
    <div class="img">
      <div class="img__text m--up">
        <h2>請認真作答</h2>
        <p>因為你的答案</p>
        <p>可能正在被某個人偷偷期待著</p>
      </div>
      <div class="img__text m--in">
        <h2>有人正在等你</h2>
        <p>你的戀愛旅程還沒到站</p>
        <p>回來看看，今天還會遇見誰 💌</p>
      </div>
      <div class="img__btn">
        <span class="m--up">立即上車</span>
        <span class="m--in">回到旅程</span>
      </div>
    </div>
    <div class="form sign-up" style="background-color: #FFF0F3;">
      <label>
        <span>交過幾任伴侶呢？</span>
        <input id="acceptfriend" name="acceptfriend" type="text" />
      </label>
      <label>
        <span>你的愛的語言是什麼？(EX:肢體接觸 ／ 讚美肯定 ／ 服務行動 ／ 送禮物）</span>
        <input id="lovestyle" name="lovestyle" type="text" />   
      </label>
      <label>
        <span>你的地雷是什麼？(EX:另一半做什麼事，會讓你心涼一截）</span>
        <input id="nonaccept" name="nonaccept"  type="text" />   
      </label>
       <label>
        <span>你的理想型？ 說說心裡那個「對的人」長什麼樣子？</span>
        <input id="appearance" name="appearance" type="text" />   
      </label>
       <label>
        <span>✨請用三個形容詞形容自己✨</span>
        <input id="tags" name="tags" type="text" />   
      </label>
      
      <button type="submit" class="submit">Submit</button>
    </div>
  </div>
      </div>
    </form>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/main.js"></script>
  <script>
$('#google-form').submit(function (e) {
    e.preventDefault();

    // 1. 蒐集所有欄位的值，並用 .trim() 去除前後空白
    const formData = {
        name: $('#name').val().trim(),
        nickname: $('#nickname').val().trim(),
        job: $('#job').val().trim(),
        ideal: $('#ideal').val().trim(),
        mbti: $('#mbti').val().trim(),
        relationship: $('#relationship').val().trim(),
        acceptfriend: $('#acceptfriend').val().trim(),
        lovestyle: $('#lovestyle').val().trim(),
        nonaccept: $('#nonaccept').val().trim(),
        appearance: $('#appearance').val().trim(),
        tags: $('#tags').val().trim()
    };

    // 2. 完整驗證：檢查是否所有欄位都有填寫（包含防止純空白）
    for (let key in formData) {
        if (!formData[key]) {
            alert('還有資訊沒填寫完整，或者偷偷輸入了空白喔！請再檢查一次！');
            
            // 貼心小優化：幫使用者把那個「只有空白」的輸入框清空，並把游標聚焦過去
            $(`#${key}`).val('').focus(); 
            return; 
        }
    }

    // 3. 驗證通過，鎖定按鈕避免重複點擊
    $('.submit').prop('disabled', true).text('上車中...');

    // 4. 發送資料到 Google 表單
    $.ajax({
        url: "https://docs.google.com/forms/d/e/1FAIpQLSd4yPHhg248azPP6lgVhzSef3DmREEyW5YwkkUBzCayQO7ljg/formResponse",
        data: {
            "entry.1388650807": formData.name,
            "entry.1616705074": formData.nickname,
            "entry.299891395": formData.job,
            "entry.1605410520": formData.ideal,
            "entry.990653743": formData.mbti,
            "entry.313554025": formData.relationship,
            "entry.2073937795": formData.acceptfriend,
            "entry.605609704": formData.lovestyle,
            "entry.232531709": formData.nonaccept,
            "entry.1644391808": formData.appearance,
            "entry.2120389988": formData.tags,
        },
        type: "POST",
        dataType: "xml",
        complete: function () {
            $('#google-form')[0].reset();
            window.location.href = "thank.html";
        }
    });
});

// 防止使用者在第一頁輸入時按 Enter 鍵直接觸發表單送出
$('#google-form').on('keydown', 'input', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        return false;
    }
});
</script>
</body>
</html>
